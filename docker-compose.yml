services:
  mongodb:
    image: mongo:6.0
    container_name: inmeta-mongodb
    restart: always
    ports:
      - "27017:27017"
    # O comando abaixo ativa o Replica Set (Obrigatório para Transactions)
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: